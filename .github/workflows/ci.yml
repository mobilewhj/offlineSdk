name: Android SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Verify SDK and sample
        run: >-
          ./gradlew :offlineSdk:testDebugUnitTest :offlineSdk:lintRelease
          :offlineSdk:compileDebugAndroidTestKotlin
          :offlineSdk:publishReleasePublicationToLocalReleaseRepository
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: offline-sdk-release
          path: |
            offlineSdk/build/outputs/aar/*release.aar
            offlineSdk/build/libs/*sources.jar
            build/repo/
          if-no-files-found: error
