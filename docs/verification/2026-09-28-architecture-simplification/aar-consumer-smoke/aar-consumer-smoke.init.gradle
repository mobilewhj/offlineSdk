// 仅用于本地 AAR 消费验证，不改变样例正常构建的 project 依赖。
def smokeVersion = gradle.startParameter.projectProperties['smokeSdkVersion'] ?: '0.2.2'

settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories.maven {
        name = 'offlineSdkLocalRelease'
        url = settings.rootDir.toPath().resolve('build/repo').toUri()
        content { includeGroup('com.github.mobilewhj.offlineSdk') }
    }
}

gradle.beforeProject { p ->
    if (p.path == ':app') {
        p.configurations.configureEach {
            resolutionStrategy.dependencySubstitution {
                substitute project(':offlineSdk') using module(
                    "com.github.mobilewhj.offlineSdk:offlineSdk:$smokeVersion"
                )
            }
        }
        p.tasks.register('verifyOfflineSdkAar') {
            doLast {
                // 核对消费者实际解析的文件，避免同一本地候选版本意外复用旧缓存而误报通过。
                def artifact = p.configurations.getByName('debugRuntimeClasspath')
                    .resolvedConfiguration.resolvedArtifacts.find {
                        it.moduleVersion.id.group == 'com.github.mobilewhj.offlineSdk' &&
                            it.name == 'offlineSdk' && it.extension == 'aar'
                    }
                if (artifact == null) throw new GradleException('消费者没有解析到 SDK AAR')
                def candidate = p.rootProject.file(
                    "build/repo/com/github/mobilewhj/offlineSdk/offlineSdk/${smokeVersion}/offlineSdk-${smokeVersion}.aar"
                )
                def sha256 = { file -> java.security.MessageDigest.getInstance('SHA-256')
                    .digest(file.bytes).encodeHex().toString() }
                def consumedSha = sha256(artifact.file)
                if (consumedSha != sha256(candidate)) {
                    throw new GradleException('消费者解析的 AAR 与当前本地候选摘要不一致')
                }
                println "Consumed SDK AAR: ${artifact.file}"
                println "Consumed SDK AAR SHA-256: $consumedSha"
            }
        }
        p.plugins.withId('com.android.application') {
            p.android.sourceSets.main.java.srcDir(
                p.rootProject.file('scripts/aar-consumer-smoke/src')
            )
        }
    }
}
